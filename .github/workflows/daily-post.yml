name: Daily blog automation

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily automation
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_SHOPPING_AFFILIATE_LINK_TEMPLATE: ${{ secrets.NAVER_SHOPPING_AFFILIATE_LINK_TEMPLATE }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: PYTHONPATH=src python3 scripts/run_daily.py

      # 네이버/티스토리는 초안(Markdown/HTML)만 자동 생성한다. 로그인 자동화는
      # 각 플랫폼 이용약관 위반 소지가 있어 구현하지 않았으므로, 아래 커밋으로
      # 올라온 drafts/ 폴더 내용을 사람이 검수 후 직접 게시해야 한다.
      - name: Commit generated drafts / history
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data drafts || true
          git diff --cached --quiet || git commit -m "chore: daily automation run"
          git push
